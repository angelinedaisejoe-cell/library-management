<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Book Management System</h1>
        <p>RESTful Services using Express and MongoDB</p>
    </header>


    <main>

        <section class="form-container">

            <h2>Add Book</h2>

            <input
                type="text"
                id="title"
                placeholder="Book Title"
            >

            <input
                type="text"
                id="author"
                placeholder="Author"
            >

            <input
                type="number"
                id="price"
                placeholder="Price"
            >

            <button onclick="addBook()">
                Add Book
            </button>

        </section>


        <section>

            <h2>Book List</h2>

            <table>

                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="bookList"></tbody>

            </table>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
